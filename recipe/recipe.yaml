schema_version: 1

context:
  version: "2.8"
  base_build_number: 1
  bootstrapping: ${{ env.get("CONDA_BUILD_BOOTSTRAPPING", default="") }}
  build_number: 1

package:
  name: patch
  version: ${{ version }}

source:
  url:
    - https://ftpmirror.gnu.org/gnu/patch/patch-${{ version }}.tar.gz
    - https://ftp.gnu.org/gnu/patch/patch-${{ version }}.tar.gz
  sha256: 308a4983ff324521b9b21310bfc2398ca861798f02307c79eb99bb0e0d2bf980

build:
  number: ${{ build_number }}
  string: h${{ hash }}_${{ build_number }}${{ "_bootstrapping" if bootstrapping == "yes" }}
  skip: win
  script:
    file: build
    env:
      CONDA_BUILD_BOOTSTRAPPING: ${{ bootstrapping }}

requirements:
  build:
    - if: bootstrapping != "yes"
      then: libtool
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - patch --help
  - if: bootstrapping != "yes"
    then:
      files:
        recipe:
          - testfile
          - testfile2
          - testfile.patch
      script:
        - patch -i testfile.patch
        - cmp testfile testfile2

about:
  homepage: http://savannah.gnu.org/projects/patch/
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: Utility to apply diffs to files
  description: |
    Patch takes a patch file containing a difference listing produced by the
    diff program and applies those differences to one or more original files,
    producing patched versions.
  repository: http://git.savannah.gnu.org/cgit/patch.git

extra:
  recipe-maintainers:
    - nehaljwani
    - mgorny
